<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="900" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f5f9"/>
      <stop offset="100%" stop-color="#e9ebf3"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="35"/></filter>
