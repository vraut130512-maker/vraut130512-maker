<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f5f9"/>
      <stop offset="100%" stop-color="#e9ebf3"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" fill="url(#base)"/>

  <!-- blurred color blobs (the "glass" light source) -->
  <circle cx="150" cy="70" r="120" fill="#0A84FF" opacity="0.55" filter="url(#blur1)"/>
  <circle cx="330" cy="230" r="90" fill="#FF375F" opacity="0.45" filter="url(#blur1)"/>
  <circle cx="770" cy="90" r="110" fill="#AF52DE" opacity="0.4" filter="url(#blur1)"/>
  <circle cx="820" cy="260" r="90" fill="#00C7BE" opacity="0.45" filter="url(#blur1)"/>
  <circle cx="520" cy="40" r="70" fill="#FF9F0A" opacity="0.3" filter="url(#blur2)"/>

  <!-- glass panel -->
  <rect x="46" y="46" width="808" height="228" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="47" y="47" width="806" height="2" rx="1" fill="#ffffff" opacity="0.8"/>

  <!-- status pill -->
  <g transform="translate(78,76)">
    <rect width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.7"/>
    <circle cx="18" cy="15" r="4.5" fill="#30D158"/>
    <text x="32" y="19.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Open to work</text>
  </g>

  <!-- name -->
  <text x="76" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#1d1d1f">Vivek Raut</text>
  <text x="79" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3a3a3c">Software Engineer &#183; B.Tech CSE, DBATU</text>

  <!-- glass tagline strip -->
  <g transform="translate(78,222)">
    <rect width="520" height="38" rx="19" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.7"/>
    <text x="24" y="24.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#3a3a3c">Building secure systems &amp; full-stack apps</text>
  </g>
</svg>
