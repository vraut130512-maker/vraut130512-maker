<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161029"/>
      <stop offset="100%" stop-color="#0b0912"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9c3ff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>
  <rect width="900" height="320" fill="url(#dots)"/>
  <circle cx="140" cy="60" r="190" fill="url(#glow1)"/>
  <circle cx="820" cy="270" r="170" fill="url(#glow2)"/>

  <!-- badge pill -->
  <g transform="translate(70,44)">
    <rect width="150" height="28" rx="14" fill="#1f1836" stroke="#3a3355"/>
    <circle cx="16" cy="14" r="4" fill="#22c55e"/>
    <text x="30" y="18.5" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#b6aee0">open to work</text>
  </g>

  <!-- name + role -->
  <text x="68" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#nameGrad)">Vivek Raut</text>
  <text x="72" y="168" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#a89fd6" letter-spacing="0.5">Software Engineer &#183; B.Tech CSE, DBATU</text>

  <!-- terminal line with typing cursor -->
  <g transform="translate(70,200)">
    <rect width="560" height="40" rx="8" fill="#150f26" stroke="#2c2547"/>
    <circle cx="18" cy="20" r="4" fill="#EC4899"/>
    <circle cx="34" cy="20" r="4" fill="#F59E0B"/>
    <circle cx="50" cy="20" r="4" fill="#22c55e"/>
    <text x="70" y="25" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#cfc9ea">building secure systems &amp; full-stack apps</text>
    <rect x="422" y="12" width="8" height="16" fill="#EC4899">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- constellation, right side -->
  <g transform="translate(760,110)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="120" ry="50" fill="none" stroke="#3a3355" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="78" ry="78" fill="none" stroke="#3a3355" stroke-width="1" transform="rotate(35)"/>
    <ellipse cx="0" cy="0" rx="50" ry="120" fill="none" stroke="#3a3355" stroke-width="1" transform="rotate(-20)"/>
    <g><circle cx="120" cy="0" r="5" fill="#EC4899"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/></g>
    <g><circle cx="78" cy="0" r="4" fill="#06B6D4" transform="rotate(35)"/><animateTransform attributeName="transform" type="rotate" from="35 0 0" to="395 0 0" dur="9s" repeatCount="indefinite"/></g>
    <g><circle cx="50" cy="0" r="4.5" fill="#F59E0B" transform="rotate(-20)"/><animateTransform attributeName="transform" type="rotate" from="-20 0 0" to="340 0 0" dur="11s" repeatCount="indefinite"/></g>
    <circle cx="0" cy="0" r="7" fill="#6C5CE7"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#6C5CE7" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- baseline accent -->
  <rect x="70" y="266" width="46" height="4" rx="2" fill="#EC4899"/>
  <rect x="122" y="266" width="14" height="4" rx="2" fill="#6C5CE7"/>
  <rect x="142" y="266" width="7" height="4" rx="2" fill="#06B6D4"/>
</svg>
